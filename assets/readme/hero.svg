<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Lid-Driven Cavity: a verified 2-D Navier-Stokes solver</title>
  <desc id="desc">Project title beside the computed streamlines of the lid-driven cavity at Reynolds number 1000 on a 257 by 257 grid: one large clockwise vortex and two small counter-rotating corner eddies. Generated by scripts/build_readme_art.py from data/cavity_Re1000_N257.npz.</desc>
  <rect width="1200" height="460" rx="24" fill="#F6F4EE"/>

  <g id="title-block" fill="#14213D">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.5" fill="#5B6676">CFD BENCHMARK · FINITE DIFFERENCES · PYTHON</text>
    <text x="60" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="72">Lid-Driven Cavity</text>
    <text x="64" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#5B6676">2-D incompressible Navier-Stokes, solved from rest</text>
    <text x="64" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#5B6676">and checked against what it should be.</text>
  </g>

