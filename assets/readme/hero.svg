    <text x="64" y="398" font-size="18" fill="#5B6676">spatial order</text>
    <text x="64" y="420" font-size="18" fill="#5B6676">manufactured solution</text>
    <text x="276" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#14213D">0.12 %</text>
    <text x="276" y="398" font-size="18" fill="#5B6676">from Ghia et al.</text>
    <text x="276" y="420" font-size="18" fill="#5B6676">ψ minimum, Re = 1000</text>
    <text x="488" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#14213D">10<tspan dy="-17" font-size="24">−14</tspan></text>
    <text x="488" y="398" font-size="18" fill="#5B6676">discrete divergence</text>
    <text x="488" y="420" font-size="18" fill="#5B6676">every production field</text>
  </g>

