[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ns2d"
version = "1.3.0"
description = "Verified 2-D incompressible Navier-Stokes solver for the lid-driven cavity, in vorticity-streamfunction form"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marouane Toumi" }]
keywords = [
    "cfd",
    "navier-stokes",
    "lid-driven-cavity",
    "finite-difference",
    "vorticity-streamfunction",
    "numerical-methods",
    "verification-and-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.14",
    "matplotlib>=3.7",
    "sympy>=1.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["ns2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full cavity integrations and stability spectra"]
